services:
  db:
    image: mysql:8.0
    container_name: db-go-tweets
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - db-go-tweets-data:/var/lib/mysql

volumes:
  db-go-tweets-data:
